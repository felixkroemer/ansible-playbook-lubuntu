- name: Ubuntu
  hosts: localhost
  vars_prompt:
    - name: gists_key
      prompt: What is the Github gists key? (Leave empty to skip)
      private: no
  vars:
    apt_packages:
      - curl
      - nfs-common
      - nautilus-dropbox
      - anki
      - rofi
      - avahi-daemon
    snap_packages:
      - firefox
      - code
    configs:
      - { src: "rofi/config.rasi", dest: "~/.config/rofi/config.rasi" }
      - { src: "kde_shortcuts/terminal.desktop", dest: "~/.local/share/applications/"}
      - { src: "kde_shortcuts/rofi.desktop", dest: "~/.local/share/applications/"}
    shortcuts:
      - { name: "terminal.desktop", key: "Alt+Return"}
      - { name: "rofi.desktop", key: "Meta+d"}
  tasks:
  - name: Update and upgrade apt packages
    become: true
    apt:
      update_cache: yes
      upgrade: dist

  - name: Install apt packages
    become: true
    apt:
      name: "{{ item }}"
      state: present
      update_cache: yes
    loop: "{{ apt_packages }}"

  - name: Install snap packages
    become: true
    community.general.snap:
      name: "{{ item }}"
      state: present
    loop: "{{ snap_packages }}"

  - name: Ensure destination directories exist
    file:
      path: "{{ item.dest | dirname }}"
      state: directory
      mode: '0755'
    loop: "{{ configs }}"

  - name: Download configs
    get_url:
      url: "https://raw.githubusercontent.com/felixkroemer/dotfiles/main/{{ item.src }}"
      dest: "{{ item.dest }}"
    loop: "{{ configs }}"

  - name: Point rofi config to KDE-generated theme
    lineinfile:
      path: ~/.config/rofi/config.rasi
      regexp: '^@theme'
      line: '@theme "~/.config/rofi/kde-colors.rasi"'

  - name: Install kde-rofi-colors script
    become: true
    copy:
      dest: /usr/local/bin/kde-rofi-colors
      mode: '0755'
      content: |
        #!/bin/bash
        # Reads KDE color scheme from ~/.config/kdeglobals and writes
        # ~/.config/rofi/kde-colors.rasi so rofi follows KDE's palette.
        set -euo pipefail

        KDEGLOBALS="${HOME}/.config/kdeglobals"
        ROFI_COLORS="${HOME}/.config/rofi/kde-colors.rasi"

        if [[ ! -f "$KDEGLOBALS" ]]; then
            echo "kde-rofi-colors: $KDEGLOBALS not found, skipping" >&2
            exit 0
        fi

        # Return the value of a key inside a named section.
        get_color() {
            local section="$1" key="$2"
            awk -F'=' -v sec="$section" -v k="$key" '
                /^\[/ { found = ($0 == "[" sec "]") }
                found && $1 == k { print $2; exit }
            ' "$KDEGLOBALS"
        }

        # Convert "r,g,b" to rofi's rgba(r, g, b, a) syntax.
        to_rgba() {
            local rgb="$1"
            IFS=',' read -r r g b <<< "$rgb"
            printf "rgba(%d, %d, %d, 1.0)" "$r" "$g" "$b"
        }

        win_bg=$(get_color "Colors:Window"    "BackgroundNormal")
        win_fg=$(get_color "Colors:Window"    "ForegroundNormal")
        sel_bg=$(get_color "Colors:Selection" "BackgroundNormal")
        sel_fg=$(get_color "Colors:Selection" "ForegroundNormal")
        view_bg=$(get_color "Colors:View"     "BackgroundNormal")
        border=$(get_color  "Colors:Window"   "DecorationFocus")

        mkdir -p "$(dirname "$ROFI_COLORS")"

        cat > "$ROFI_COLORS" << RASI
        /* Auto-generated from KDE color scheme — do not edit manually */
        * {
            background-color: $(to_rgba "$win_bg");
            text-color:       $(to_rgba "$win_fg");
            border-color:     $(to_rgba "$border");
        }

        window {
            background-color: $(to_rgba "$win_bg");
            border:           1px solid;
            border-radius:    6px;
            padding:          4px;
        }

        mainbox {
            background-color: transparent;
            border:           0px;
            padding:          0px;
        }

        inputbar {
            background-color: $(to_rgba "$view_bg");
            text-color:       $(to_rgba "$win_fg");
            padding:          8px;
            border:           0px 0px 1px 0px;
            border-color:     $(to_rgba "$border");
        }

        prompt {
            background-color: transparent;
            text-color:       $(to_rgba "$win_fg");
            padding:          0px 8px 0px 0px;
        }

        entry {
            background-color: transparent;
            text-color:       $(to_rgba "$win_fg");
        }

        listview {
            background-color: transparent;
            border:           0px;
            scrollbar:        false;
            padding:          4px 0px;
        }

        element {
            background-color: transparent;
            text-color:       $(to_rgba "$win_fg");
            padding:          4px 8px;
            border-radius:    4px;
        }

        element selected {
            background-color: $(to_rgba "$sel_bg");
            text-color:       $(to_rgba "$sel_fg");
        }

        element-icon {
            background-color: transparent;
            size:             1.2em;
        }

        element-text {
            background-color: transparent;
            text-color:       inherit;
        }
        RASI

  - name: Ensure systemd user directory exists
    file:
      path: ~/.config/systemd/user
      state: directory
      mode: '0755'

  - name: Install kde-rofi-colors systemd path unit
    copy:
      dest: ~/.config/systemd/user/kde-rofi-colors.path
      content: |
        [Unit]
        Description=Watch KDE global config for color changes

        [Path]
        PathModified=%h/.config/kdeglobals

        [Install]
        WantedBy=default.target

  - name: Install kde-rofi-colors systemd service unit
    copy:
      dest: ~/.config/systemd/user/kde-rofi-colors.service
      content: |
        [Unit]
        Description=Sync KDE color scheme to rofi theme

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/kde-rofi-colors

  - name: Enable and start kde-rofi-colors path unit
    systemd:
      name: kde-rofi-colors.path
      scope: user
      state: started
      enabled: true
      daemon_reload: true

  - name: Generate initial rofi KDE colors
    command: /usr/local/bin/kde-rofi-colors
    failed_when: false

  - name: Enable Shortcuts
    shell: kwriteconfig5 --file kglobalshortcutsrc --group {{ item.name }} --key '_launch' '{{ item.key }},none,none'
    loop: "{{ shortcuts }}"

  # must probably come before the potd setup 
  - name: Set accent color from wallpaper to false
    shell: kwriteconfig5 --file kdeglobals --group General --key accentColorFromWallpaper true

  - name: Configure KDE wallpaper to use Bing Picture of the Day
    shell: |
      qdbus org.kde.plasmashell /PlasmaShell org.kde.PlasmaShell.evaluateScript '
        desktops().forEach(d => {
          d.wallpaperPlugin = "org.kde.potd";
          d.currentConfigGroup = ["Wallpaper", "org.kde.potd", "General"];
          d.writeConfig("Provider", "bing");
          d.reloadConfig();
        });
      '

  - name: Create SSH key
    when: gists_key != ""
    command: ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
    args:
      creates: ~/.ssh/id_ed25519

  - name: Fetch gist keys
    when: gists_key != ""
    uri:
      url: https://gist.githubusercontent.com/felixkroemer/c628ea1015e56f7d2f42f0c92c67ec92/raw/keys
      return_content: yes
    register: gist_keys

  - name: Update keys content
    when: gists_key != ""
    shell: |
      new_entry=$(cat ~/.ssh/id_ed25519.pub)
      new_user=$(echo "$new_entry" | awk '{print $NF}')
      existing="{{ gist_keys.content }}"
      if echo "$existing" | grep -q "$new_user"; then
        echo "$existing" | sed "/$new_user/c\\$new_entry"
      else
        printf '%s\n' "$existing" "$new_entry"
      fi
    register: updated_keys

  - name: Upload updated keys to gist
    when: gists_key != ""
    uri:
      url: https://api.github.com/gists/c628ea1015e56f7d2f42f0c92c67ec92
      method: PATCH
      headers:
        Authorization: "token {{ gists_key }}"
        Content-Type: "application/json"
      body_format: json
      body:
        files:
          keys:
            content: "{{ updated_keys.stdout }}"
      status_code: 200

  - name: Mount nfs
    become: yes
    ansible.posix.mount:
      src: oslo.local:/data
      path: /home/fekr/data
      opts: rw,soft,timeo=30,retrans=3,noatime
      state: mounted
      fstype: nfs
